  @keyframes rise { 0%{opacity:1; transform:translateY(0);} 100%{opacity:0; transform:translateY(-70px);} }

  /* ===== 小游戏元素 ===== */
  .mouse { position:absolute; z-index:7; font-size:30px; cursor:pointer; touch-action:none; }
  .fallItem { position:absolute; z-index:7; font-size:30px; pointer-events:none; }
  #catchBowl { position:absolute; left:50%; bottom:170px; transform:translateX(-50%); font-size:44px;
    z-index:8; display:none; touch-action:none; cursor:grab; }

  #banner { position:absolute; top:38%; left:50%; transform:translate(-50%,-50%); z-index:20;
    background:#fff8e7; border:4px solid #5a3d5c; padding:14px 20px; font-size:15px; color:#5a3d5c;
    text-align:center; display:none; box-shadow:6px 6px 0 #5a3d5c66; line-height:1.7; }

  /* ===== 底部按钮 ===== */
  #actions { position:absolute; bottom:12px; left:0; right:0; display:flex; justify-content:center; gap:10px; z-index:15; flex-wrap:wrap; padding:0 8px; }
  .btn { min-width:64px; padding:8px 6px; border:3px solid #5a3d5c; background:#fff8e7; font-size:20px;
    font-family:inherit; box-shadow:4px 4px 0 #5a3d5c; display:flex; flex-direction:column; align-items:center; gap:1px; cursor:pointer; color:#5a3d5c; }
  .btn span { font-size:11px; }
  .btn:active { transform:translate(3px,3px); box-shadow:1px 1px 0 #5a3d5c; }
  .btn.game { background:#ffe0eb; }
  #mute { position:absolute; top:150px; right:12px; z-index:15; background:#fff8e7; border:3px solid #5a3d5c;
    width:38px; height:38px; font-size:18px; box-shadow:3px 3px 0 #5a3d5c; }
</style>
<base target="_blank">
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="meter" id="fHeart">💗<div class="bar"><div class="fill" style="width:70%"></div></div></div>
    <div class="meter" id="fFood">🍚<div class="bar"><div class="fill" style="width:70%"></div></div></div>
    <div class="meter" id="fPlay">🧶<div class="bar"><div class="fill" style="width:70%"></div></div></div>
    <div id="fishRow">🐟小鱼干 × <span id="fishN">0</span></div>
    <div id="moodText">小猫心情不错～</div>
  </div>
  <button id="mute">🔊</button>
  <div id="sun"></div><div id="window"></div><div id="sofa"></div><div id="rug"></div>
  <div id="bowl">🥣</div>
  <div id="cat"></div>
  <div id="zzz">💤</div>
  <div id="catchBowl">🧺</div>
  <div id="banner"></div>
  <div id="actions">
    <button class="btn" id="btnFeed">🍖<span>喂肉肉</span></button>
    <button class="btn" id="btnPet">💗<span>摸摸</span></button>
    <button class="btn game" id="btnMouse">🐭<span>抓老鼠</span></button>
    <button class="btn game" id="btnCatch">🥫<span>接罐头</span></button>
    <button class="btn game" id="btnBall">🧶<span>毛线球</span></button>
  </div>
</div>

<script>
(function(){
  var SPR=4, cat=document.getElementById('cat'), zzz=document.getElementById('zzz'),
      bowl=document.getElementById('bowl'), catchBowl=document.getElementById('catchBowl'),
      banner=document.getElementById('banner'), moodText=document.getElementById('moodText'),
      fishN=document.getElementById('fishN'),
      fills={heart:document.querySelector('#fHeart .fill'),
             food:document.querySelector('#fFood .fill'),
             play:document.querySelector('#fPlay .fill')};
  var v={heart:70,food:70,play:70}, fish=0, muted=false, game=null;

  /* ===== 帧表 ===== */
  var F={ idle:[[3,3]], alert:[[7,3]], scratchSelf:[[5,0],[6,0],[7,0]],
          scratchWallE:[[2,2],[2,3]], sleep:[[2,0],[2,1]],
          walkN:[[1,2],[1,3]], walkS:[[6,3],[7,2]], walkE:[[3,0],[3,1]], walkW:[[4,2],[4,3]],
          walkNE:[[0,2],[0,3]], walkNW:[[1,0],[1,1]], walkSE:[[5,1],[5,2]], walkSW:[[5,3],[6,1]] };
  function frame(c,r){ cat.style.backgroundPosition=(-c*32*SPR)+'px '+(-r*32*SPR)+'px'; }
  var animTimer=null,animIdx=0;
  function playAnim(fs,fps){ if(animTimer)clearInterval(animTimer); animIdx=0; frame(fs[0][0],fs[0][1]);
    animTimer=setInterval(function(){ animIdx=(animIdx+1)%fs.length; frame(fs[animIdx][0],fs[animIdx][1]); },1000/(fps||5)); }

  /* ===== 声音 ===== */
  var ctx=null;
  function ac(){ if(!ctx){try{ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}} return ctx; }
  function beep(f1,f2,dur,type,vol){ if(muted)return; var c=ac(); if(!c)return;
    var o=c.createOscillator(),g=c.createGain(); o.type=type||'square';
    o.frequency.setValueAtTime(f1,c.currentTime); o.frequency.linearRampToValueAtTime(f2,c.currentTime+dur);
    g.gain.setValueAtTime(vol||.12,c.currentTime); g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+dur);
    o.connect(g).connect(c.destination); o.start(); o.stop(c.currentTime+dur+.02); }
  function meow(){ beep(430,390,.35,'sine',.2); setTimeout(function(){},0); if(!muted){var c=ac();if(c){var o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.setValueAtTime(660,c.currentTime-.0);g.gain.value=0;o.connect(g);o.start();o.stop();}} }
  function purr(sec){ if(muted)return; var c=ac(); if(!c)return;
    var o=c.createOscillator(),g=c.createGain(),l=c.createOscillator(),lg=c.createGain();
    o.type='sawtooth'; o.frequency.value=50; l.frequency.value=23; lg.gain.value=.5; g.gain.value=.05;
    l.connect(lg).connect(g.gain); o.connect(g).connect(c.destination); o.start(); l.start();
    o.stop(c.currentTime+sec); l.stop(c.currentTime+sec); }
  function yay(){ beep(520,780,.12,'square',.12); setTimeout(function(){beep(660,990,.15,'square',.12);},120); }

  /* ===== 状态条 ===== */
  function clamp(x){ return Math.max(0,Math.min(100,x)); }
  function refresh(){
    fills.heart.style.width=v.heart+'%'; fills.food.style.width=v.food+'%'; fills.play.style.width=v.play+'%';
    fishN.textContent=fish;
    var t;
    if(v.food<25) t='小猫饿了，喂点肉肉吧～';
    else if(v.heart<25) t='小猫想被摸摸了💗';
    else if(v.play<25) t='小猫无聊，玩个小游戏吧🐭';
    else if(v.heart>85&&v.food>85&&v.play>85) t='小猫幸福得呼噜呼噜～';
    else t='小猫心情不错～';
    moodText.textContent=t;
  }
  setInterval(function(){ v.heart=clamp(v.heart-.3); v.food=clamp(v.food-.25); v.play=clamp(v.play-.35); refresh(); },3000);
  refresh();

  function floatText(x,y,txt){ var e=document.createElement('div'); e.className='float'; e.textContent=txt;
    e.style.left=x+'px'; e.style.top=y+'px'; document.getElementById('app').appendChild(e);
    setTimeout(function(){e.remove();},1300); }
  var hearts=['💗','💖','💕'];

  /* ===== 猫AI ===== */
  var W=0,H=0,cx=120,cy=320,tx=120,ty=320,mode='idle',modeT=0,SPEED=2.6;
  function bounds(){W=innerWidth;H=innerHeight;} bounds(); addEventListener('resize',bounds);
  function setCat(){ cat.style.left=(cx-64)+'px'; cat.style.top=(cy-64)+'px';
    zzz.style.left=(cx+34)+'px'; zzz.style.top=(cy-66)+'px'; }
  function bowlP(){ var r=bowl.getBoundingClientRect(); return {x:r.left+r.width/2,y:r.top+r.height/2}; }
  function chooseDir(dx,dy){ var ax=Math.abs(dx),ay=Math.abs(dy);
    if(ax>ay*2) return dx>0?'walkE':'walkW';
    if(ay>ax*2) return dy>0?'walkS':'walkN';
    if(dx>0) return dy>0?'walkSE':'walkNE';
    return dy>0?'walkSW':'walkNW'; }

  function dashTo(x,y,done){ mode='dash';
    tx=Math.max(70,Math.min(W-70,x));
    ty=Math.max(H*.42,Math.min(H-195,y));
    dashDone=done; }
  var dashDone=null;

  function update(){
    if(game){ playAnim(F.idle,2); return; }
    modeT--;
    if(mode==='sleep'){
      if(!(v.heart>85&&v.food>85&&v.play>85)){ mode='idle'; modeT=30; zzz.style.display='none'; }
      else { setCat(); return; }
    }
    var dx=tx-cx, dy=ty-cy, d=Math.hypot(dx,dy);
    if(d>10){
      playAnim(F[chooseDir(dx,dy)],7);
      cx+=dx/d*SPEED; cy+=dy/d*SPEED;
      cx=Math.max(70,Math.min(W-70,cx));
      cy=Math.max(H*.42,Math.min(H-190,cy));
    } else {
      if(mode==='dash'){ var f=dashDone; dashDone=null; mode='idle'; modeT=40; if(f)f(); }
      else if(mode==='eat'){ playAnim(F.scratchWallE,4); if(modeT<=0)mode='idle'; }
      else if(mode==='swat'){ playAnim(F.scratchWallE,4); if(modeT<=0)mode='idle'; }
      else { if(modeT<=0){ var r=Math.random();
        if(r<.3){ playAnim(F.scratchSelf,3); modeT=90; }
        else if(r<.45){ playAnim(F.alert,1); modeT=50; meow(); }
        else { tx=80+Math.random()*(W-160); ty=H*.48+Math.random()*(H*.3); modeT=60; } } }
    }
    if(v.heart>85&&v.food>85&&v.play>85&&mode!=='sleep'&&mode!=='dash'){
      mode='sleep'; zzz.style.display='block'; playAnim(F.sleep,1.5); purr(3); }
    setCat();
  }
  setInterval(update,33);

  /* ===== 摸猫 ===== */
  function doPet(x,y){ if(game)return;
    v.heart=clamp(v.heart+1.5); refresh();
    cat.classList.add('glow'); floatText(x-10,y-20,hearts[Math.floor(Math.random()*3)]);
    if(mode!=='dash'){ playAnim(F.scratchSelf,4); mode='idle'; modeT=50; }
    purr(1.4);
    setTimeout(function(){cat.classList.remove('glow');},600);
  }
  cat.addEventListener('pointermove',function(e){ if(e.buttons||e.pointerType==='touch') doPet(e.clientX,e.clientY); });
  cat.addEventListener('pointerdown',function(e){ doPet(e.clientX,e.clientY); meow(); });
  document.getElementById('btnPet').addEventListener('click',function(){ doPet(cx,cy-30); });

  /* ===== 喂食 ===== */
  document.getElementById('btnFeed').addEventListener('click',function(){
    if(game||mode==='eat')return;
    var b=bowlP(); dashTo(b.x+78,b.y-5,function(){
      mode='eat'; modeT=210; meow();
      var n=0, iv=setInterval(function(){ n++; v.food=clamp(v.food+6); refresh();
        floatText(b.x-10,b.y-30,'🍖'); if(n>=6)clearInterval(iv); },380);
    });
  });

  /* ===== 游戏1：抓老鼠（30秒） ===== */
  var mice=[], mouseTimer=null, mouseScore=0, mouseTick=null;
  function endMouseGame(){
    clearInterval(mouseTimer); clearInterval(mouseTick);
    mice.forEach(function(m){m.el.remove();}); mice=[];
    game=null; banner.style.display='none';
    fish+=mouseScore*2; v.play=clamp(v.play+mouseScore*3); refresh(); yay();
    floatText(cx-30,cy-80,'抓到'+mouseScore+'只！+'+(mouseScore*2)+'🐟');
  }
  function spawnMouse(){
    var side=Math.random()<.5, el=document.createElement('div');
    el.className='mouse'; el.textContent='🐭';
    var y=H*.5+Math.random()*(H*.32), fromLeft=Math.random()<.5;
    var x=fromLeft?-40:W+40, dir=fromLeft?1:-1;
    el.style.left=x+'px'; el.style.top=y+'px';
    document.getElementById('app').appendChild(el);
    var m={el:el,x:x,y:y,dir:dir,speed:2+Math.random()*2};
    el.addEventListener('pointerdown',function(){
      dashTo(m.x,m.y+20,function(){ mode='swat'; modeT=36; meow(); });
      mouseScore++; floatText(m.x,m.y-20,'❗+'+2+'🐟'); v.play=clamp(v.play+2); refresh();
      clearInterval(m.iv); m.el.remove();
      mice=mice.filter(function(o){return o!==m;});
    });
    m.iv=setInterval(function(){ m.x+=m.dir*m.speed; m.el.style.left=m.x+'px';
      if(m.x<-60||m.x>W+60){ clearInterval(m.iv); m.el.remove(); mice=mice.filter(function(o){return o!==m;}); } },33);
    mice.push(m);
  }
  document.getElementById('btnMouse').addEventListener('click',function(){
    if(game)return;
    game='mouse'; mouseScore=0; banner.style.display='block';
    banner.innerHTML='🐭 抓老鼠！30秒<br>点老鼠，小猫帮你抓！<br>一只=2条小鱼干';
    var t=3, cd=setInterval(function(){ t--;
      banner.innerHTML='🐭 抓老鼠！30秒<br>点老鼠！<br>一只=2条小鱼干<br><br>'+(t>0?t:'GO!');
      if(t<0){ clearInterval(cd); banner.style.display='none';
        mouseTimer=setInterval(spawnMouse,650);
        mouseTick=setInterval(function(){ endMouseGame(); },30000);
      } },800);
  });

  /* ===== 游戏2：接罐头（30秒） ===== */
  var catchItems=[], catchIv=null, catchScore=0, catchEnd=null;
  function endCatch(){
    clearInterval(catchIv); clearTimeout(catchEnd);
    catchItems.forEach(function(i){i.el.remove();}); catchItems=[]; catchBowl.style.display='none';
    game=null; fish+=catchScore; v.food=clamp(v.food+catchScore*2); refresh(); yay();
    floatText(innerWidth/2-50,H*.4,'接到'+catchScore+'个！+'+catchScore+'🐟');
  }
  document.getElementById('btnCatch').addEventListener('click',function(){
    if(game)return;
    game='catch'; catchScore=0; catchBowl.style.display='block';
    var bx=innerWidth/2; catchBowl.style.left=(bx-22)+'px'; catchBowl.style.bottom='170px'; catchBowl.style.top='auto';
    var drag=false;
    catchBowl.onpointerdown=function(e){ drag=true; catchBowl.setPointerCapture(e.pointerId); };
    window.onpointermove=function(e){ if(drag){ bx=Math.max(30,Math.min(innerWidth-60,e.clientX)); catchBowl.style.left=bx+'px'; } };
    window.onpointerup=function(){ drag=false; };
    var goods=['🥫','🐟','🍗','🍤'], bads=['🧅','🌶️'];
    catchIv=setInterval(function(){
      var el=document.createElement('div'); el.className='fallItem';
      var good=Math.random()>.25;
      el.textContent=good?goods[Math.floor(Math.random()*4)]:bads[Math.floor(Math.random()*2)];
      var ix=30+Math.random()*(innerWidth-90);
      el.style.left=ix+'px'; el.style.top='-40px';
      document.getElementById('app').appendChild(el);
      var it={el:el,x:ix,y:-40,good:good,iv:null};
      it.iv=setInterval(function(){
        it.y+=3.4; it.el.style.top=it.y+'px';
        var br=catchBowl.getBoundingClientRect();
        if(it.y>H-260 && it.y<H-190 && it.x>br.left-20 && it.x<br.right+20){
          clearInterval(it.iv); it.el.remove();
          if(it.good){ catchScore++; floatText(it.x,H-260,'+1'); beep(600,900,.1,'square',.1); }
          else { catchScore=Math.max(0,catchScore-1); floatText(it.x,H-260,'-1💦'); beep(300,150,.2,'sawtooth',.1); }
        } else if(it.y>H-150){ clearInterval(it.iv); it.el.remove(); }
      },33);
      catchItems.push(it);
    },520);
    catchEnd=setTimeout(endCatch,30000);
  });

  /* ===== 游戏3：毛线球（自由玩） ===== */
  var ballEl=null;
  document.getElementById('btnBall').addEventListener('click',function(){
    if(ballEl){ ballEl.remove(); ballEl=null; return; }
    ballEl=document.createElement('div'); ballEl.className='mouse'; ballEl.textContent='🧶';
    ballEl.style.left='30px'; ballEl.style.top=(H*.6)+'px'; ballEl.style.fontSize='48px';
    document.getElementById('app').appendChild(ballEl);
    var drag=false;
    ballEl.onpointerdown=function(e){ drag=true; ballEl.setPointerCapture(e.pointerId); };
    window.addEventListener('pointermove',function(e){ if(drag&&ballEl){ ballEl.style.left=(e.clientX-24)+'px'; ballEl.style.top=(e.clientY-24)+'px';
      var d=Math.hypot(e.clientX-cx,e.clientY-cy);
      if(d<340&&mode!=='dash') dashTo(e.clientX,e.clientY+10,function(){ mode='swat'; modeT=36; meow(); v.play=clamp(v.play+3); refresh(); });
    }});
    window.addEventListener('pointerup',function(){ drag=false; });
  });

  /* ===== 静音 ===== */
  document.getElementById('mute').addEventListener('click',function(){ muted=!muted; this.textContent=muted?'🔇':'🔊'; });

  playAnim(F.idle,2);
})();
</script>
</body>
</html>
